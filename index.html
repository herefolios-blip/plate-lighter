svg.addEventListener('pointermove',e=>{if(!drag)return;mv=1;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse()),R=S.room,A=S.actor;
 if(drag.startsWith('cm')){S.cams[+drag[2]].m={x:q.x,y:q.y}}else if(drag.startsWith('cam')){const c=S.cams[+drag[3]];c.x=q.x;c.y=q.y;if(c.m){}}else if(drag=='actor'){A.x=q.x;A.y=q.y;if(S.tab=='studio')left()}
 else if(drag.length==2&&drag[0]=='s')S.manual[drag]={...S.manual[drag],x:cl(q.x,.2,R.w-.2),y:cl(q.y,.3,R.d-.3)};
 else S.manual[drag]={...S.manual[drag],th:norm(Math.atan2(q.x-A.x,q.y-A.y)*180/Math.PI-base()),d:cl(Math.hypot(q.x-A.x,q.y-A.y),.8,6)};regen()});
svg.addEventListener('pointerup',e=>{if(drag){draw();right();pview();if(!mv&&(drag.startsWith('cam')||drag=='actor')){if(drag.startsWith('cam'))S.pv=+drag[3];openPop(drag,e)}}drag=null});
left();regen();
</script></body></html>
