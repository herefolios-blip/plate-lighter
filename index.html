<title>Plate Lighter</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>

.bar2{display:flex;justify-content:space-between;margin-bottom:8px}#stage{flex:1;min-height:0;position:relative}#plan,#v3{position:absolute;inset:0;width:100%;height:100%}#v3[hidden]{display:none}#cv{width:100%;height:100%;display:block;border-radius:4px;touch-action:none;cursor:grab}

.lc.sel .ed{border-top:1px solid var(--ln);margin-top:8px;padding-top:4px}

</style></head><body>
<header><h1>Plate Lighter</h1><span class="seg"><button data-u="m" class="on">m</button><button data-u="ft">ft</button></span>
<details class="menu"><summary>File</summary><div><button id="sv">Save in browser</button><button id="op">Open saved</button><button id="exi">Export plan image</button><button id="ex">Export file</button><button id="im">Import file</button></div></details><input type="file" id="imf" accept=".json" hidden></header>
<main><aside id="L"></aside><section id="C"><div class="bar2"><span class="seg"><button data-vw="plan" class="on">Plan</button><button data-vw="3d">3D view</button></span><label class="chk"><input type="checkbox" id="bmc" checked> Beams</label><span class="seg" id="sets"></span></div>
<div id="stage"><svg id="plan"></svg><div id="v3" hidden><canvas id="cv"></canvas><div id="ov"></div></div></div></section><aside id="R"></aside></main>
<dialog id="exd"><h3 style="margin:0 0 10px">Export plan image</h3><label style="display:block;margin-bottom:10px">Name for this plan<input id="exn" type="text" placeholder="e.g. Library scene, shot 12" style="width:100%;margin-top:4px;background:#15161a;color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:7px;font:inherit"></label><label class="chk" style="margin-bottom:14px"><input type="checkbox" id="ex3"> Also export the 3D view as a second image</label><div class="tabs" style="margin:0"><button id="exg" class="on">Export</button><button id="exc">Cancel</button></div></dialog>

<script>
const $=s=>document.querySelector(s),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rad=d=>d*Math.PI/180,sg=v=>v<0?-1:1;
const S={u:'m',room:{w:9,d:7,h:3},scr:{type:'U',w:6,h:2,sd:3,fl:1,fd:3},cams:[{n:'Front',on:1,m:null,x:4.5,y:5.8,h:1.4,tilt:0,lens:35},{n:'Side',on:0,m:null,x:8.4,y:1.8,h:1.4,tilt:0,lens:35}],pv:0,vw:'plan',name:'',pose:'stand',beam:1,op:{act:1,plate:1,key:1,room:1,scr:1,cam:0,pw:0},pw:'wall',actor:{x:4.5,y:1.8},mk:[],mkm:0,stand:2.8,amps:13,
plate:{th:-70,el:30,soft:60,cct:4300,tint:0,hue:300,sat:70,acc:true,accTh:110},kit:{1:8,2:5,3:6},setup:'A',manual:{},sel:null,tab:'plate',note:''};S.cam=S.cams[0];
const CM=()=>S.cams.filter(c=>c.on),hd=c=>Math.atan2(S.actor.x-c.x,c.y-S.actor.y),norm=a=>((a+540)%360)-180,base=()=>{const c=S.cams[0];return Math.atan2(c.x-S.actor.x,c.y-S.actor.y)*180/Math.PI};
const FX={1:{n:'Aperture bulb (RGB)',ba:120,w:7,lux:350,sz:.1},2:{n:'Amaran P60 (RGB)',ba:55,w:60,lux:2500,sz:.35},3:{n:'Wireless RGB rectangle light',ba:100,w:20,lux:1200,sz:.6}};
const ROLES={key:{n:'Key',pref:s=>s>=50?[2,3,1]:[2,1,3],t:300,el:()=>S.plate.el},fill:{n:'Fill',pref:()=>[3,2,1],t:100,el:()=>8},rim:{n:'Rim',pref:()=>[2,1,3],t:200,el:()=>32},
acc:{n:'Accent',pref:()=>[3,1,2],t:80,el:()=>5},sL:{n:'Screen left',pref:()=>[2,3,1],t:250},sR:{n:'Screen right',pref:()=>[2,3,1],t:250}};
const SETUPS={A:{n:'A: Full realism',r:['key','rim','sL','sR','fill','acc']},B:{n:'B: Minimal rig',r:['key','rim','sL','sR']}};
const U=m=>S.u=='m'?m.toFixed(1)+' m':(m*3.281).toFixed(1)+' ft';
const show=(v,f)=>f=='m'?U(+v):f=='k'?v+' K':f?v+f:v;
const get=p=>p.split('.').reduce((o,k)=>o[k],S),set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
function cct2rgb(k){const t=k/100,c=v=>cl(Math.round(v),0,255);return[t<=66?255:c(329.7*Math.pow(t-60,-.1332)),t<=66?c(99.47*Math.log(t)-161.12):c(288.12*Math.pow(t-60,-.0755)),t>=66?255:t<=19?0:c(138.52*Math.log(t-10)-305.04)]}

function rgb2hs(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return[Math.round(h),mx?Math.round(d/mx*100):0]}
/* ---------- lighting generator ---------- */
const modOf=(role,fx,soft)=>role=='key'?(fx&&fx==FX[3]?(soft>=35?['Built-in softbox',.8]:['Egg-crate grid',.55]):soft>=65?['Softbox + grid',.55]:soft>=35?['Diffusion frame',.75]:['Bare + barn doors',1]):role=='fill'?['Bounce or diffusion',.75]:role=='rim'?['Barn doors + flag',1]:role=='acc'?['Bare, narrow',1]:['Diffusion wash',.8];
const HB=()=>S.pose=='sit'?.75:1.2,AH=()=>S.pose=='sit'?1.1:1.5,HEAD=()=>S.pose=='sit'?1.3:1.75;
const desk=()=>{if(S.pose!='sit')return null;const A=S.actor,c=S.cams[0],tx=c.x-A.x,ty=c.y-A.y,l=Math.hypot(tx,ty)||1,t=[tx/l,ty/l],pp=[-t[1],t[0]],o=[A.x+t[0]*.55,A.y+t[1]*.55];return[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>[o[0]+pp[0]*.6*a+t[0]*.35*b,o[1]+pp[1]*.6*a+t[1]*.35*b])};
const cone=(L,col)=>{if(!S.beam||!L.fx)return'';const dx=L.aim.x-L.x,dy=L.aim.y-L.y,len=Math.hypot(dx,dy)*1.15,a=Math.atan2(dy,dx),hw=rad(L.fx.ba/2);return`<polygon points="${L.x},${L.y} ${L.x+len*Math.cos(a-hw)},${L.y+len*Math.sin(a-hw)} ${L.x+len*Math.cos(a+hw)},${L.y+len*Math.sin(a+hw)}" fill="${col}" opacity="${S.sel==L.role?.32:.05}" />`};
const inF1=(c,x,y,h)=>{const a=hd(c),dx=x-c.x,dy=y-c.y,d=dx*Math.sin(a)-dy*Math.cos(a),l=dx*Math.cos(a)+dy*Math.sin(a);if(d<=0)return false;return Math.atan2(Math.abs(l),d)<Math.atan(18/c.lens)+.05&&Math.abs(Math.atan2(h-c.h,Math.hypot(l,d))-rad(c.tilt))<Math.atan(12/c.lens)+.05};
const inF=(x,y,h)=>CM().some(c=>[c,...(c.m?[{...c,x:c.m.x,y:c.m.y},{...c,x:(c.x+c.m.x)/2,y:(c.y+c.m.y)/2}]:[])].some(v=>inF1(v,x,y,h)));
function pos(th,d,el){const A=S.actor,R=S.room,B=base();let x=A.x+d*Math.sin(rad(th+B)),y=A.y+d*Math.cos(rad(th+B)),cx=cl(x,.3,R.w-.3),cy=cl(y,.3,R.d-.3),clamped=cx!=x||cy!=y;
 if(clamped){x=cx;y=cy;d=Math.hypot(x-A.x,y-A.y);th=norm(Math.atan2(x-A.x,y-A.y)*180/Math.PI-B)}
 const max=Math.min(S.stand,R.h-.15),need=HB()+d*Math.tan(rad(el));return{x,y,th,d,clamped,need,h:Math.min(need,max),max}}
function clear(p){for(let h=p.h;h<=p.max+1e-6;h+=.1)if(!inF(p.x,p.y,h)){p.h=h;return true}return false}
function build(){const used={},P=S.plate,out=[],A=S.actor,sc=S.room.w/2;
 SETUPS[S.setup].r.filter(r=>S.scr.type!='none'||r.length!=2||r[0]!='s').forEach(role=>{const R=ROLES[role],L={role,flags:[],name:R.n},M=S.manual[role],scr=role[0]=='s'&&role.length==2;
  if(scr){L.x=M?M.x:sc+(role=='sL'?-1:1)*S.scr.w*.45;L.y=M?M.y:1.3;L.h=Math.min(M&&M.h!=null?M.h:2.2,S.stand,S.room.h-.15);L.aim={x:sc,y:0};L.d=Math.hypot(L.x-sc,L.y);L.th=0}
  else{const s=sg(P.th),b=role=='key'?{th:P.th,d:1.6+(100-P.soft)/100*1.2}:role=='fill'?{th:-s*50,d:2.4}:role=='rim'?{th:-s*150,d:2.2}:{th:P.accTh,d:2.5};
   let p=pos(M?M.th:b.th,M?M.d:b.d,R.el());if(M&&M.h!=null){p.h=Math.min(M.h,p.max);p.need=p.h}if(p.clamped)L.flags.push(['adj','Room limits the distance, so it sits closer than ideal']);
   if(p.need>p.max+.01)L.flags.push(['adj','Height capped at '+U(p.max)+' (ideal '+U(p.need)+')']);
   if(inF(p.x,p.y,p.h)){const h0=p.h;let ok=clear(p);if(ok)L.flags.push(['adj','Raised from '+U(h0)+' to '+U(p.h)+' to stay out of frame']);
    else if(!M&&role!='key'){for(let k=1;k<=14&&!ok;k++){const t=p.th,q=pos(t+(Math.abs(t)>90?-1:1)*sg(t)*k*5,b.d,R.el());if(clear(q)){p=q;ok=true;L.flags.push(['adj','Moved wider to '+Math.round(Math.abs(q.th))+'° to stay out of frame'])}}}
    if(!ok)L.flags.push(['bad','In the camera frame. Try a longer lens, a tilt up, or move it wider'])}
   Object.assign(L,{x:p.x,y:p.y,h:p.h,d:p.d,th:p.th,aim:A})}
  const id=R.pref&&R.pref(P.soft).find(i=>(S.kit[i]||0)-(used[i]||0)>0);
  if(id){used[id]=(used[id]||0)+1;L.fx=FX[id]}else L.flags.push(['bad','No fixture left in your kit for this role. Add one to the kit tab']);
  L.target=R.t;const soft=P.soft;

   if(L.inten>100){const alt=Object.keys(FX).map(Number).filter(i=>FX[i]!=L.fx&&(S.kit[i]||0)-(used[i]||0)>0&&calc(FX[i])<=100).sort((a,b)=>FX[a].lux-FX[b].lux)[0];

let LT=[];
function regen(k){S.room.w=S.room.w;const R=S.room;S.actor.x=cl(S.actor.x,.6,R.w-.6);S.actor.y=cl(S.actor.y,.8,R.d-.6);S.cams.forEach(c=>{c.x=cl(c.x,.3,R.w-.3);c.y=cl(c.y,.3,R.d-.2);if(c.m){c.m.x=cl(c.m.x,.3,R.w-.3);c.m.y=cl(c.m.y,.3,R.d-.2)}});

/* ---------- plan drawing ---------- */
function draw(){const R=S.room,A=S.actor,p=1,svg=$('#plan'),sc=R.w/2,Z=S.scr,gw='#2e9b57';
 svg.setAttribute('viewBox',`${-p} ${-p-.5} ${R.w+2*p} ${R.d+2*p+.5}`);
 let g='';for(let i=1;i<R.w;i++)g+=`M${i} 0V${R.d}`;for(let i=1;i<R.d;i++)g+=`M0 ${i}H${R.w}`;

 CM().forEach(c=>{const i=S.cams.indexOf(c),a=hd(c),L=Math.hypot(A.x-c.x,A.y-c.y)+2,t=Math.tan(Math.atan(18/c.lens)),f=[Math.sin(a),-Math.cos(a)],r=[Math.cos(a),Math.sin(a)];

 {const D=desk();if(D)h+=`<polygon points="${D.map(q=>q.join(',')).join(' ')}" fill="#6b5a45" opacity=".85" />`}
